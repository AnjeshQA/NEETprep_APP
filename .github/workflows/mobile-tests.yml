name: Mobile Tests (Appium + pytest)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch when a new commit arrives
concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirments.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirments.txt

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Check test credentials
        env:
          TEST_MOBILE: ${{ secrets.TEST_MOBILE }}
          TEST_OTP: ${{ secrets.TEST_OTP }}
        run: |
          if [ -z "$TEST_MOBILE" ] || [ -z "$TEST_OTP" ]; then
            echo "::error::Repository secrets TEST_MOBILE and/or TEST_OTP are not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Download APK
        env:
          APK_URL: ${{ secrets.APK_URL }}
        run: |
          if [ -z "$APK_URL" ]; then
            echo "::error::Repository secret APK_URL is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir -p apk
          curl -fL "$APK_URL" -o apk/app.apk
          ls -lh apk/app.apk

      # GitHub's Linux runners support hardware acceleration only after enabling KVM
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_APK_PATH: ${{ github.workspace }}/apk/app.apk
          TEST_MOBILE: ${{ secrets.TEST_MOBILE }}
          TEST_OTP: ${{ secrets.TEST_OTP }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python -m pytest TestCases --alluredir=allure-results --reruns 1

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore

      - name: Upload raw results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-and-logs
          path: |
            allure-results
            Logs
          if-no-files-found: ignore
